<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Layton" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fbfaf7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#14130f"
    />
    <meta
      name="description"
      content="Layton — a quiet, offline-first place to write fiction, synced to your account."
    />
    <title>Layton</title>
    <script>
      // Resolve the theme to a `.dark` class before first paint. shadcn keys
      // every dark: utility off that class, so "system" has to become a
      // concrete class here rather than being left to a media query.
      try {
        var t = localStorage.getItem("layton:theme");
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
